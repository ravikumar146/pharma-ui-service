<app-header [brandName]="brandName" [navigationLinks]="navigationLinks" [cartCount]="cartService.itemCount()" />

<main class="payment-page">
    <div class="payment-wrapper">
        <a routerLink="/cart" class="back-link"> ← Back to cart </a>
        <section class="payment-card">
            <span class="eyebrow">
                Secure checkout
            </span>
            <h1>
                Complete your payment
            </h1>
            <p class="payment-description">
                Review your total and continue to secure payment.
            </p>
            <div class="amount-box">
                <span class="amount-label">
                    Total amount
                </span>
                <strong class="amount">
                    ₹{{ payableTotal | number }}
                </strong>
            </div>
            <button type="button" class="pay-button" (click)="pay()" [disabled]="loading || payableTotal <= 0">
                @if (loading) {
                <span class="spinner"></span>
                <span> Creating order... </span>
                } @else {
                <span> Pay ₹{{ payableTotal | number }} </span>
                <span class="arrow"> → </span>
                }
            </button>
            <p class="secure-note">
                🔒 Secure payment powered by Razorpay
            </p>
        </section>
    </div>
</main>

<app-footer />
